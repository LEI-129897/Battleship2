# 129897 - Pedro Figueiredo
name: Checkstyle smell gate 129897

on:
  push:
    branches: [main, "129897"]
  pull_request:
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Checkstyle CLI
        run: |
          wget https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.15.0/checkstyle-10.15.0-all.jar -O checkstyle.jar

      - name: Run Checkstyle Analysis
        run: |
          java -jar checkstyle.jar -c checkstyle-129897.xml .