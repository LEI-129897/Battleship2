# 129897 - Pedro Figueiredo
name: Checkstyle smell gate 129897

on:
  push:
    branches: [main, "129897"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Checkstyle
        uses: nikitasmss/checkstyle-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-129897.xml