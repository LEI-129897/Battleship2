# 129897 - Pedro Figueiredo
name: Qodana smell gate 129897

on:
  push:
    branches: [main, "129897"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run Qodana Quality Gate
        uses: JetBrains/qodana-action@v2024.3.4
        with:
          args: "--config=qodana-129897.yaml --linter jetbrains/qodana-jvm-community:2024.3"
          use-annotations: true
          post-pr-comment: true